[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spac-ann-3c-inversion"
version = "0.1.0"
description = "Physics-guided 3C SPAC/F-J, RayDec/DFA HVSR, PyTorch ADsurf determinant, MDN/JointNet/CNF & Parallel-Tempering rj-MCMC surface-wave inversion toolkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "bariseng" }]
keywords = [
    "surface-waves",
    "SPAC",
    "F-J-method",
    "HVSR",
    "RayDec",
    "diffuse-field",
    "ADsurf",
    "normalizing-flows",
    "rj-MCMC",
    "geophysics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "numba>=0.58",
    "torch>=2.1",
    "disba>=0.7",
    "pyproj>=3.5",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["spac_ann*"]
